version: '3.8'

services:
  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_DB=flutter_auth
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=TQr132123
    ports:
      - "5433:5432"
    volumes:
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"] 
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    expose:
      - "8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=flutter_auth
      - DB_USER=postgres
      - DB_PASSWORD=TQr132123
      - JWT_SECRET=EshKushDev2024SecretKey123!@#
      - JWT_REFRESH_SECRET=EshKushDev2024RefreshKey456!@#
      - PORT=8080
      - ENVIRONMENT=development
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: 
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    volumes:
      - ./backend:/app/backend
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      - backend

  swagger:
    build:
      context: ./backend
      dockerfile: swagger/Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - ./backend/lib/config/swagger.json:/usr/share/nginx/html/swagger.json:ro
      - ./backend/swagger/swagger-ui-master/Swagger.html:/usr/share/nginx/html/index.html:ro
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  backend_deps: