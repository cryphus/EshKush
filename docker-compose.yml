services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=flutter_auth
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=TQr132123
    ports:
      - "5433:5432"
    volumes:
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    expose:
      - "8080"
    environment:
      - DATABASE_URL=postgresql://postgres:TQr132123@postgres:5432/flutter_auth
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=flutter_auth
      - DB_USER=postgres
      - DB_PASSWORD=TQr132123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - JWT_SECRET=EshKushDev2024SecretKey123!@#
      - JWT_REFRESH_SECRET=EshKushDev2024RefreshKey456!@#
      - PORT=8080
      - ENVIRONMENT=development
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  backend_deps:
  redis_data:
