services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Отдельная БД только для интеграционных тестов репозиториев.
  # Использует тот же init.sql → чистая схема при каждом запуске.
  postgres-test:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=eshkush_test
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Интеграционные тесты репозиториев против postgres-test.
  repo-tests:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: repo-tests
    environment:
      - TEST_DB_HOST=postgres-test
      - TEST_DB_PORT=5432
      - TEST_DB_NAME=eshkush_test
      - TEST_DB_USER=${DB_USER}
      - TEST_DB_PASSWORD=${DB_PASSWORD}
      - BCRYPT_LOG_ROUNDS=4
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    networks:
      - app-network
    depends_on:
      postgres-test:
        condition: service_healthy

  # Прогоняет unit-тесты перед стартом бекенда.
  # Если хотя бы один тест упал — бекенд не поднимается,
  # а в логах видно какие именно тесты провалились.
  unit-tests:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      # cost=4 — минимум для тестов, в 256 раз быстрее дефолтного 12
      - BCRYPT_LOG_ROUNDS=4
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - PORT=${PORT}
      - ENVIRONMENT=${ENVIRONMENT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW_MINUTES=${RATE_LIMIT_WINDOW_MINUTES:-1}
      - MAX_REQUEST_BODY_BYTES=${MAX_REQUEST_BODY_BYTES:-10485760}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_JSON=${LOG_JSON:-true}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID:-}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY:-}
      - YOOKASSA_API_BASE_URL=${YOOKASSA_API_BASE_URL:-https://api.yookassa.ru/v3}
      - YOOKASSA_RETURN_URL=${YOOKASSA_RETURN_URL:-https://eshkush.app/payments/return}
      - YOOKASSA_WEBHOOK_SECRET=${YOOKASSA_WEBHOOK_SECRET:-}
      - REFUND_WINDOW_HOURS=${REFUND_WINDOW_HOURS:-24}
      - YANDEX_CLIENT_ID=${YANDEX_CLIENT_ID:-}
      - YANDEX_CLIENT_SECRET=${YANDEX_CLIENT_SECRET:-}
      - VK_CLIENT_ID=${VK_CLIENT_ID:-}
      - VK_CLIENT_SECRET=${VK_CLIENT_SECRET:-}
      - OAUTH_CALLBACK_BASE_URL=${OAUTH_CALLBACK_BASE_URL:-http://localhost:8080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    networks:
      - app-network
    depends_on:
      unit-tests:
        condition: service_completed_successfully
        required: false
      repo-tests:
        condition: service_completed_successfully
        required: false
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-8080}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # E2E-тесты HTTP-уровня: RBAC, JSON-форматы, пагинация, коды ошибок.
  # Сначала сидирует admin-пользователя в основную БД, затем гоняет тесты.
  e2e-tests:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: e2e-tests
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - TEST_BASE_URL=http://backend:${PORT:-8080}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - BCRYPT_LOG_ROUNDS=4
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    command: ["/app/migrate"]
    networks:
      - app-network
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles:
      - migrate

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      # Раскомментировать после настройки SSL-сертификатов (см. nginx.conf)
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Для HTTPS: смонтировать папку с сертификатами Let's Encrypt
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-network
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - app-network
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  backend_deps:
  redis_data:
