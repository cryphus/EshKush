<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>EshKush API Documentation</title>
    <link rel="stylesheet" type="text/css" href="swagger/swagger-ui-master/dist/swagger-ui.css">
    <link rel="icon" type="image/png" href="swagger/swagger-ui-master/dist/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="swagger/swagger-ui-master/dist/favicon-16x16.png" sizes="16x16" />
    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }
        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }
        body {
            margin: 0;
            background: #fafafa;
        }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="swagger/swagger-ui-master/dist/swagger-ui-bundle.js"></script>
    <script src="swagger/swagger-ui-master/dist/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            const ui = SwaggerUIBundle({
                url: "backend/lib/config/swagger.json",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                docExpansion: "list",
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 1,
                defaultModelRendering: 'example',
                displayRequestDuration: true,
                filter: true,
                showExtensions: true,
                showCommonExtensions: true,
                supportedSubmitMethods: [
                    'get',
                    'put',
                    'post',
                    'delete',
                    'options',
                    'head',
                    'patch',
                    'trace'
                ]
            });
            window.ui = ui;
        };
    </script>
</body>
</html>
