name: eshkush
description: EshKush project

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  dio: ^5.4.0
  mask_text_input_formatter: ^2.5.0
  email_validator: ^2.1.17
  dropdown_button2: ^2.3.9
  flutter_svg: ^2.0.9
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  google_sign_in: ^6.2.1
  shared:
    path: ../shared
  http: ^1.1.0
  url_launcher: ^6.2.4
  webdev_proxy: ^0.1.0
  flutter_riverpod: ^2.4.9
  connectivity_plus: ^5.0.2
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  web: ^1.1.0
  qr_flutter: ^4.1.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
  fonts:
    - family: stolzl
      fonts:
        - asset: assets/fonts/stolzl_thin.otf
          weight: 100
        - asset: assets/fonts/stolzl_light.otf
          weight: 300
        - asset: assets/fonts/stolzl_regular.otf
          weight: 400
        - asset: assets/fonts/stolzl_medium.otf
          weight: 500
        - asset: assets/fonts/stolzl_book.otf
          weight: 600
        - asset: assets/fonts/stolzl_bold.otf
          weight: 700
