name: eshkush
description: EshKush project

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  dio: ^5.0.0
  mask_text_input_formatter: ^2.9.0
  email_validator: ^2.1.17
  dropdown_button2: ^2.3.9
  flutter_svg: ^2.0.9
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  google_sign_in: ^6.1.6
  backend:
    path: ../backend

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: stolzl
      fonts:
        - asset: assets/fonts/stolzl_regular.otf
          weight: 600
        - asset: assets/fonts/stolzl_bold.otf
          weight: 700
        - asset: assets/fonts/stolzl_book.otf
          weight: 200
        - asset: assets/fonts/stolzl_light.otf
          weight: 300
        - asset: assets/fonts/stolzl_medium.otf
          weight: 500
        - asset: assets/fonts/stolzl_thin.otf
          weight: 100
